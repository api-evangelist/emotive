  used_by: Open API (orders, opt-outs), Lists API, custom events
  evidence: 'Observed live 2026-08-13: POST https://api.emotiveapp.co/ecommerce/v1/orders/ with no credentials returned 401 {"detail":"Authentication credentials were not provided."}'
- name: field-errors
  shape: '{"<field_name>": ["<validation message>", ...]}'
