format: ad-hoc-json
rfc9457: false
rfc9457_note: >-
  Emotive publishes no RFC 9457 problem+json. Every error body in every one of the seven
  OpenAPI documents is declared as application/json with an ad-hoc envelope, and no
  operation declares application/problem+json. There is no machine-readable error code
  vocabulary anywhere in the surface: errors are distinguished only by HTTP status plus a
  free-text human string, so a client cannot branch on an error type.
