problem_types:
- status: 400
  title: Bad Request
  meaning: Missing or invalid data provided.
  remediation: >-
    The response body carries an "error" attribute (Open API) or a field-keyed array of
    validation messages (custom events) explaining what to correct. For orders, all of
    customer.phone, line_items[].product.title, line_items[].product.sku,
    line_items[].price, total_price, order_id and order_date must be present and valid.
  occurrences: 35
  media_type: application/json
- status: 401
  title: Unauthorized / Authentication Failure
  meaning: Credentials absent, malformed, or invalid.
  remediation: >-
    Supply `Authorization: Token <api_token>` on the Open API and Lists API, `X-API-Key`
    on the Helpdesk API, or `Authorization: bearer <emotive JWT>` on the Auth Server.
    Note the scheme prefix — the literal word "Token" and a space — is required.
  occurrences: 60
  media_type: application/json
- status: 403
  title: Forbidden
  meaning: Authenticated but not permitted. On the gateway this also surfaces as "Brand is not active".
  remediation: Confirm the brand is active and the token belongs to the brand you are addressing.
  occurrences: 7
  media_type: application/json
- status: 404
  title: Resource not found
  meaning: 'Unknown resource. Gateway variants observed: "user_id is not valid", "brand_id is not valid", "Token does not exist".'
  remediation: Verify the path identifiers. Note that api.emotiveapp.co soft-404s unknown paths with an HTML 200 app shell rather than a 404, so a 404 here comes from the application, not the edge.
  occurrences: 30
  media_type: application/json
- status: 405
  title: Method not allowed
  meaning: Wrong HTTP verb for the path.
  remediation: All three Open API endpoints are POST-only.
  occurrences: 1
- status: 409
  title: Conflict
  meaning: 'State conflict. Gateway variant: "Role already assigned to a user in a brand."'
  occurrences: 2
- status: 412
  title: Precondition failed
  occurrences: 1
- status: 413
  title: Request entity too large
  occurrences: 1
- status: 500
  title: Internal server error
  occurrences: 1
- status: 501
  title: Not implemented
  occurrences: 1
- status: 503
  title: Service unavailable
  remediation: Check https://status.emotive.io/ — API Services is a monitored component.
  occurrences: 1
