aid: emotive
name: Emotive
description: >-
  Emotive is an SMS marketing platform for eCommerce brands, combining two-way
  conversational text messaging, behavioral triggers, and automation with a
  dedicated managed service (TextPros) of ex-agency SMS strategists and copywriters.
  Its products include SMS Marketing campaigns and flows, CartAI cart-recovery pixel
  technology, multi-touch Attribution analytics, and integrations with eCommerce
  platforms, email service providers, and business tools. Emotive markets a "5X ROI
  guarantee" to Shopify and other direct-to-consumer merchants. The company was
  surfaced as a portfolio company of CRV and later acquired by Privy. Emotive
  operates a public marketing site and app but publishes no public developer/API
  program or specification.
