aid: emotive
name: Emotive
description: >-
  Emotive is an SMS marketing platform for eCommerce brands, combining two-way
  conversational text messaging, behavioral triggers, and automation with a
  dedicated managed service (TextPros) of ex-agency SMS strategists and copywriters.
  Its products include SMS Marketing campaigns and flows, CartAI cart-recovery pixel
  technology, multi-touch Attribution analytics, RealLink branded short links, and
  integrations with eCommerce platforms, email service providers, and business tools.
  Emotive markets a "5X ROI guarantee" to Shopify and other direct-to-consumer
  merchants. The company was surfaced as a portfolio company of CRV and was acquired
  by Privy. Emotive runs a real, publicly documented developer surface: an Open API
  for order tracking, manual opt-outs and custom events on api.emotiveapp.co; a Lists
  / Subscriber API documented in GitBook; and an API gateway at api-gw.emotiveapp.co
  that serves five OpenAPI 3.0.2 documents (Helpdesk, Sensus Webhooks, Auth Server,
  Segments, Experiences). Its Mintlify knowledge base publishes an llms.txt, an A2A
  agent card, a packaged Agent Skill and an anonymous remote MCP server.
