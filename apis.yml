  generated: '2026-08-13'
  method: searched
  note: >-
    Emotive publishes no priced tiers; the pricing page is a "talk to an SMS expert"
    lead form advertising a 14-day free trial and a meet-or-beat price promise. API
    tokens are not self-service in the general case — the Open API docs say to contact
    support@emotive.io for a key — though a List Growth API signup flow inside the app
    issues a key to an existing customer.
