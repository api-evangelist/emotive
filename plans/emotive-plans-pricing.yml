note: >-
  Emotive publishes no priced tiers, no rate card and no numeric quota anywhere. The
  pricing page is a lead-capture form — "Talk to an SMS expert", with fields for annual
  online sales bracket and eCommerce platform — wrapped around three claims: "Cut your
  SMS costs by up to 50%", "we offer contract buyouts for every one of our competitors",
  and "We'll meet or beat any price, anytime". That last line is the actual pricing
  policy: price is negotiated per account against whatever the prospect is paying today,
  which is why no tier can be published. Nothing on the page, the products pages, or the
  knowledge base attaches a price, an included message volume, or an overage rate to a
  named plan.
