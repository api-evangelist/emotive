openapi: 3.2.0
info:
  license:
    name: Private
  title: Emotive Auth Server Zapier Me API
  version: 0.1.0
servers:
- url: /auth
tags:
- name: Zapier Me API
paths:
  /v1/zapier/me:
    post:
      operationId: controllers.auth.zapier_me
      requestBody:
        content:
          application/json:
            schema:
              properties:
                helpdesk_api_key:
                  description: Emotive Helpdesk API Key
                  type: string
                orders_api_key:
                  description: Emotive Orders API Key
                  type: string
        required: true
        x-body-name: body
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonResponse'
          description: Connection OK.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonResponse'
          description: Authentication Failed
      summary: Authenticate Emotive Zapier App Api Key by calling Sensus/Helpdesk
      tags:
      - Zapier Me API
components:
  schemas:
    JsonResponse:
      properties:
        message:
          type: string
      type: object
  securitySchemes:
    ApiKeyAuth:
      in: header
      name: X-API-Key
      type: apiKey
      x-apikeyInfoFunc: core.api_security.api_key
