openapi: 3.2.0
info:
  license:
    name: Private
  title: Emotive Auth Server Product API
  version: 0.1.0
  x-origin:
  - url: https://api-gw.emotiveapp.co/auth/openapi.json
    format: openapi
    version: 3.0.2
    method: searched
    retrieved: '2026-08-13'
