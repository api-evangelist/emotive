openapi: 3.2.0
info:
  license:
    name: Private
  title: Emotive Auth Server Logout API
  version: 0.1.0
servers:
- url: /auth
tags:
- name: Logout
paths:
  /logout:
    get:
      operationId: controllers.auth0.logout
      responses:
        '302':
          description: Auth0 logout endpoint.
          headers:
            Location:
              description: Auth0 logout endpoint.
              schema:
                format: uri
                type: string
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonResponse'
          description: Authentication Failed
      summary: Logout user on Emotive and redirect to Auth0 logout endpoint
      tags:
      - Logout
  /v2/logout:
    get:
      operationId: controllers.auth_v2.logout
      responses:
        '302':
          description: Emotive Login endpoint.
          headers:
            Location:
              description: Emotive Login endpoint.
              schema:
                format: uri
                type: string
      summary: Logout user on Emotive and redirect to appropriate login endpoint
      tags:
      - Logout
components:
  schemas:
    JsonResponse:
      properties:
        message:
          type: string
      type: object
  securitySchemes:
    ApiKeyAuth:
      in: header
      name: X-API-Key
      type: apiKey
      x-apikeyInfoFunc: core.api_security.api_key
