openapi: 3.2.0
info:
  license:
    name: Private
  title: Sensus Webhooks QA API
  version: 0.1.0
servers:
- url: /sensus-webhook
tags:
- name: QA
paths:
  /v1/messages/qa/callback:
    post:
      description: QA message callback.
      operationId: controllers.webhooks.qa_callback_handler
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/QAMessageCallbackBody'
        required: true
        x-body-name: body
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonResponse'
          description: Webhook Accepted.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonResponse'
          description: Bad Request
      tags:
      - QA
      summary: Controllers webhooks qa callback handler
      x-summary-source: derived
components:
  schemas:
    QAMessageCallbackBody:
      properties:
        body:
          description: text content of the message
          type: string
        error_code:
          description: message error code
          type: integer
        from:
          description: The phone number that sent this message
          type: string
        id:
          description: unique identifier for the message
          type: string
        status:
          description: status of the message
          example: received
          type: string
        to:
          description: The phone number of the recipient
          type: string
      type: object
    JsonResponse:
      properties:
        message:
          type: string
      type: object
