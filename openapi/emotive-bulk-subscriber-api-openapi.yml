openapi: 3.2.0
info:
  license:
    name: Private
  title: Sensus Webhooks Bulk Subscriber API
  version: 0.1.0
servers:
- url: /sensus-webhook
tags:
- name: Bulk Subscriber
paths:
  /v1/subscriber/bulk:
    post:
      description: Create subscribers in bulk.
      operationId: controllers.webhooks.bulk_subscriber_handler
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkSubscriber'
        required: true
        x-body-name: body
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonResponse'
          description: Webhook Accepted.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonResponse'
          description: Bad Request
      tags:
      - Bulk Subscriber
      summary: Controllers webhooks bulk subscriber handler
      x-summary-source: derived
components:
  schemas:
    BulkSubscriber:
      items:
        $ref: '#/components/schemas/Subscriber'
      type: array
    Property:
      properties:
        key:
          type: string
        type:
          enum:
          - string
          - number
          - boolean
          - datetime
          type: string
        value:
          anyOf:
          - type: string
          - type: number
          - type: integer
          - type: boolean
      required:
      - key
      - value
      type: object
    ExternalIdentifier:
      properties:
        custom:
          items:
            properties:
              name:
                type: string
              value:
                type: string
            type: object
          type: array
        klaviyo:
          type: string
        shopify:
          type: string
      type: object
    Subscriber:
      anyOf:
      - required:
        - phone_number
        - subscribe_identifier
      - required:
        - email
        - subscribe_identifier
      properties:
        birthdate:
          type: string
        context:
          additionalProperties:
            oneOf:
            - type: string
            - type: number
            - type: integer
            - type: boolean
          type: object
        email:
          type: string
        external_identifiers:
          $ref: '#/components/schemas/ExternalIdentifier'
        first_name:
          type: string
        last_name:
          type: string
        phone_number:
          type: string
        platform:
          enum:
          - alloy
          - emotive
          - privy
          type: string
        popup_identifier:
          type: string
        properties:
          $ref: '#/components/schemas/PropertyList'
        source_type:
          enum:
          - EMOTIVE_POPUP
          - EMOTIVE_EMBEDDED
          - BACK_IN_STOCK_POPUP
          - LIST_GROWTH
          type: string
        subscribe_identifier:
          type: string
        subsource_identifier:
          type: string
      type: object
    PropertyList:
      items:
        $ref: '#/components/schemas/Property'
      type: array
    JsonResponse:
      properties:
        message:
          type: string
      type: object
