openapi: 3.2.0
info:
  license:
    name: Private
  title: Sensus Webhooks Profile Properties API
  version: 0.1.0
servers:
- url: /sensus-webhook
tags:
- name: Profile Properties
paths:
  /v1/errors/alloy:
    post:
      description: Alloy error log.
      operationId: controllers.webhooks.alloy_error_handler
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlloyError'
        required: true
        x-body-name: body
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonResponse'
          description: Alloy Error Log Accepted.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonResponse'
          description: Bad Request
      tags:
      - Profile Properties
      summary: Controllers webhooks alloy error handler
      x-summary-source: derived
  /v1/profiles/properties:
    post:
      description: Create a profile property.
      operationId: controllers.webhooks.profile_handler
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileProperty'
        required: true
        x-body-name: body
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonResponse'
          description: Webhook Accepted.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonResponse'
          description: Bad Request
      tags:
      - Profile Properties
      summary: Controllers webhooks profile handler
      x-summary-source: derived
components:
  schemas:
    Property:
      properties:
        key:
          type: string
        type:
          enum:
          - string
          - number
          - boolean
          - datetime
          type: string
        value:
          anyOf:
          - type: string
          - type: number
          - type: integer
          - type: boolean
      required:
      - key
      - value
      type: object
    AlloyError:
      properties:
        blockId:
          type: string
        blockType:
          type: string
        error:
          type: string
        executionId:
          type: string
        workflowId:
          type: string
      required:
      - workflowId
      - executionId
      - blockId
      - blockType
      - error
      type: object
    PropertyList:
      items:
        $ref: '#/components/schemas/Property'
      type: array
    ProfileProperty:
      properties:
        email:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        phone_number:
          type: string
        platform:
          enum:
          - alloy
          - paragon
          - custom
          - zapier
          type: string
        properties:
          $ref: '#/components/schemas/PropertyList'
        source:
          type: string
      required:
      - source
      - platform
      - properties
      type: object
    JsonResponse:
      properties:
        message:
          type: string
      type: object
