openapi: 3.2.0
info:
  license:
    name: Private
  title: Helpdesk Ticket Systems API
  version: 0.1.0
servers:
- url: /helpdesk
tags:
- name: Ticket Systems
paths:
  /ticket_systems:
    get:
      description: Get ticketing system types.
      operationId: controllers.ticket_systems.get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketSystemTypeListSchema'
          description: Ticket Systems supported list.
      security:
      - bearerAuth: []
      - cookieAuth: []
      tags:
      - Ticket Systems
      summary: Controllers ticket systems get
      x-summary-source: derived
  /ticket_systems/{ticket_system_id}/flows:
    get:
      description: Get ticketing system flows.
      operationId: controllers.ticket_system_flows.list_objects
      parameters:
      - in: path
        name: ticket_system_id
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketSystemFlowListSchema'
          description: Ticket Systems supported list.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonResponse'
          description: Bad Request.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonResponse'
          description: Unauthorized.
      security:
      - bearerAuth: []
      - cookieAuth: []
      tags:
      - Ticket Systems
      summary: Controllers ticket system flows list objects
      x-summary-source: derived
components:
  schemas:
    TicketSystemTypeSchema:
      properties:
        id:
          type: integer
        name:
          type: string
      type: object
    TicketSystemFlowListSchema:
      properties:
        flows:
          items:
            $ref: '#/components/schemas/TicketSystemFlowSchema'
          type: array
        id:
          type: integer
        title:
          type: string
    TicketSystemFlowSchema:
      properties:
        description:
          type: string
        id:
          type: integer
        title:
          type: string
        url:
          type: string
      type: object
    TicketSystemTypeListSchema:
      properties:
        ticket_systems:
          items:
            $ref: '#/components/schemas/TicketSystemTypeSchema'
          type: array
      type: object
    JsonResponse:
      properties:
        message:
          type: string
      type: object
  securitySchemes:
    AlloyKeyAuth:
      in: header
      name: X-API-Key
      type: apiKey
      x-apikeyInfoFunc: core.auth.alloy_user_key
    ApiKeyAuth:
      in: header
      name: X-API-Key
      type: apiKey
      x-apikeyInfoFunc: core.auth.api_key
    InternalApiKeyAuth:
      in: header
      name: X-API-Key
      type: apiKey
      x-apikeyInfoFunc: core.auth.internal_api_key
    bearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
      x-bearerInfoFunc: core.auth.jwt_auth
    cookieAuth:
      in: cookie
      name: access_token_cookie
      type: apiKey
      x-apikeyInfoFunc: core.auth.jwt_auth
