source: mcp/emotive-mcp.yml + openapi/*.yml
note: 'Emotive publishes both an MCP server and seven OpenAPI documents, but they do not overlap: the
  MCP server is Mintlify''s documentation server, and every one of its three tools operates on documentation
  rather than on an Emotive API. There is therefore no tool-to-operation binding to record. All 102 published
  REST operations are rest_only — an agent that connects to Emotive''s MCP server can read the docs but
  cannot call a single Emotive endpoint through it.'
