observations:
- The word "Product" names two unrelated entities in two different specs — an entitlement in the Auth Server and a merchandise SKU in the Open API. Nothing in either document disambiguates them.
- No entity exposes an Emotive-issued subscriber identifier. Every subscriber-facing write is keyed on a phone number or email, which is also why there is no way to make those writes idempotent.
- The Experiences API returns analytics for an Experience but never defines one; the Experience resource itself has no published schema or CRUD surface.
- Free-form extra_data escape hatches appear on Order, Customer, ShippingAddress and LineItem, so the commerce payload is only partially typed.
