summary: >-
  Emotive's data model has one root tenant — the Brand — and three loosely joined
  sub-graphs hanging off it: identity (brand, user, role, product), messaging
  (subscriber, profile property, segment, experience) and commerce (order, line item,
  product, collection, variant). The graph is not knitted together in the specs: the
  Subscriber is identified by phone_number or email rather than by an Emotive
  subscriber id, and the Order references its customer only by phone. There is no
  published id-prefix scheme and no single subscriber resource that spans the services.
identity_join_keys:
- key: phone_number
  format: E.164
  note: The primary join key across the whole platform. Subscribers, orders, opt-outs, custom events and profile properties are all keyed on it.
- key: email
  note: Accepted as an alternative identifier wherever phone_number is.
- key: brand_id
  note: Tenant discriminator on the gateway services (Helpdesk, Auth Server).
- key: subscribe_identifier
  note: Identifies the List Growth signup flow a subscriber is added to. Returned by the Subscriber Lists endpoint and required on subscriber creation.
- key: external_ticket_id / external_user_id
  note: The integrator's own identifiers, mapped to Emotive ticket and user ids by the Helpdesk service.
