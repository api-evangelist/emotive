notes: >-
  Emotive publishes a public Atlassian Statuspage covering API Services, website, popup,
  broadcast and integrations. Beyond that, the operational-transparency surface is empty:
  no changelog, no versioning policy, no deprecation policy, no SLA. The 2026-07 profile of
  this company recorded "Emotive operates no publicly documented API program" — that was
  wrong, and this pass corrects it. Emotive publishes six OpenAPI documents of its own,
  a GitBook developer reference, an llms.txt, an A2A agent card, a packaged Agent Skill and
  an anonymous remote MCP server. What it does not publish is any lifecycle commitment
  around them.
